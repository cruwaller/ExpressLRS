

[env:SERIAL_ESP82xx_2G4_TX]
extends = esp82xx_sx128x_tx
build_flags =
    ${esp82xx_sx128x_tx.build_flags}
    -D SERIAL_PASSTHROUGH=1
	-D SERIAL_BAUD=115200
	-include src/include/target_DIY_RX_ESP82xx.h

# ----------------------------------------

[env:SERIAL_ESP82xx_2G4_RX]
extends = esp82xx_sx128x_rx
build_flags =
    ${esp82xx_sx128x_rx.build_flags}
    -D SERIAL_PASSTHROUGH=1
	-D SERIAL_BAUD=115200
